<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퀴즈 왕국 (Quiz Kingdom)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    #app {
      background: white;
      width: 100%;
      max-width: 600px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 상단 헤더 & 스탯 바 */
    header {
      background: #4A90E2;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title-badge {
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.8rem;
      width: fit-content;
    }

    .stats {
      display: flex;
      gap: 15px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    /* 메인 컨텐츠 영역 */
    main {
      padding: 20px;
      min-height: 400px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* 버튼 공통 스타일 */
    .btn {
      background: #4A90E2;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
      margin-bottom: 10px;
    }

    .btn:hover {
      background: #357ABD;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #d0d0d0;
    }

    /* 카테고리 선택 화면 */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .category-card {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 15px;
      padding: 25px 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .category-card:hover {
      border-color: #4A90E2;
      transform: translateY(-3px);
    }

    .category-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    /* 스테이지 선택 화면 */
    .stage-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .stage-card {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .stage-card:hover {
      border-color: #4A90E2;
    }

    .stage-stars {
      color: #ffc107;
    }

    /* 퀴즈 화면 */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .timer {
      font-size: 1.2rem;
      font-weight: bold;
      color: #e74c3c;
    }

    .question-box {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 20px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .options-grid {
      display: grid;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e9ecef;
      padding: 15px;
      border-radius: 10px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: #4A90E2;
      background: #f4f8ff;
    }

    /* 아이템 영역 */
    .items-bar {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .item-btn {
      flex: 1;
      background: #fff;
      border: 1px solid #ddd;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* 하단 네비게이션 */
    nav {
      display: flex;
      border-top: 1px solid #eee;
      background: #fafafa;
    }

    .nav-btn {
      flex: 1;
      padding: 15px;
      border: none;
      background: none;
      font-weight: bold;
      color: #666;
      cursor: pointer;
    }

    .nav-btn.active {
      color: #4A90E2;
      border-top: 3px solid #4A90E2;
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- 상단 헤더 -->
    <header>
      <div class="user-info">
        <span class="title-badge" id="user-title">초보 퀴즈러</span>
        <h2 style="font-size: 1.2rem;">퀴즈 왕국</h2>
      </div>
      <div class="stats">
        <span>⭐ <span id="user-stars">0</span></span>
        <span>🪙 <span id="user-points">100</span>P</span>
      </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main>
      <!-- 1. 카테고리 선택 화면 -->
      <div id="view-categories" class="view active">
        <h3>카테고리 선택</h3>
        <div class="category-grid">
          <div class="category-card" onclick="selectCategory('korean')">
            <div class="category-icon">🇰🇷</div>
            <h4>국어</h4>
          </div>
          <div class="category-card" onclick="selectCategory('math')">
            <div class="category-icon">🔢</div>
            <h4>수학</h4>
          </div>
          <div class="category-card" onclick="selectCategory('society')">
            <div class="category-icon">🏛️</div>
            <h4>사회</h4>
          </div>
          <div class="category-card" onclick="selectCategory('science')">
            <div class="category-icon">🔬</div>
            <h4>과학</h4>
          </div>
        </div>
      </div>

      <!-- 2. 스테이지 선택 화면 (1~10단계) -->
      <div id="view-stages" class="view">
        <button class="btn btn-secondary" onclick="showView('view-categories')" style="width: auto; padding: 6px 12px; margin-bottom: 15px;">← 카테고리 선택으로</button>
        <h3 id="selected-category-title">카테고리명</h3>
        <div class="stage-grid" id="stage-list">
          <!-- JS로 Stage 1 ~ Stage 10 동적 생성 -->
        </div>
      </div>

      <!-- 3. 퀴즈 진행 화면 -->
      <div id="view-quiz" class="view">
        <div class="quiz-header">
          <span id="quiz-progress" style="font-weight: bold;">문제 1 / 5</span>
          <span class="timer">⏱️ <span id="time-left">15</span>초</span>
        </div>

        <div class="question-box" id="question-text">
          문제가 여기에 표시됩니다.
        </div>

        <div class="options-grid" id="options-container">
          <!-- 보기 버튼 동적 생성 -->
        </div>

        <div class="items-bar">
          <button class="item-btn" onclick="useItem('time')">⏳ 시간연장 (<span id="item-time-count">2</span>)</button>
          <button class="item-btn" onclick="useItem('hint')">💡 힌트 (<span id="item-hint-count">2</span>)</button>
          <button class="item-btn" onclick="useItem('double')">2️⃣ 2배점수 (<span id="item-double-count">1</span>)</button>
        </div>
      </div>

      <!-- 4. 결과 화면 -->
      <div id="view-result" class="view" style="text-align: center; padding: 20px 0;">
        <h2 id="result-title" style="margin-bottom: 10px;">스테이지 완료!</h2>
        <div style="font-size: 3rem; margin: 15px 0;" id="result-stars">⭐⭐⭐</div>
        <p style="font-size: 1.1rem; margin-bottom: 20px;">획득 포인트: +<span id="result-points">0</span>P</p>
        <button class="btn" onclick="showView('view-stages')">스테이지 목록으로</button>
      </div>

      <!-- 5. 상점 화면 -->
      <div id="view-shop" class="view">
        <h3>아이템 / 칭호 상점</h3>
        <div style="margin-top: 15px;">
          <h4>아이템 구매</h4>
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee;">
            <span>⏳ 시간 연장 (+10초)</span>
            <button class="btn" style="width: auto; margin:0;" onclick="buyItem('time', 30)">30P</button>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee;">
            <span>💡 힌트 (오답 1개 제거)</span>
            <button class="btn" style="width: auto; margin:0;" onclick="buyItem('hint', 40)">40P</button>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee;">
            <span>2️⃣ 점수 2배</span>
            <button class="btn" style="width: auto; margin:0;" onclick="buyItem('double', 50)">50P</button>
          </div>
        </div>
      </div>
    </main>

    <!-- 하단 네비게이션 -->
    <nav>
      <button class="nav-btn active" onclick="navTo('view-categories', this)">퀴즈</button>
      <button class="nav-btn" onclick="navTo('view-shop', this)">상점</button>
    </nav>
  </div>

  <script>
    // 버전을 높여 기존 캐시 데이터를 자동 리셋합니다.
    const CURRENT_VERSION = 'v3_multi_questions';

    // 1. 게임 데이터 상태
    let gameState = {
      version: CURRENT_VERSION,
      points: 100,
      stars: 0,
      equippedTitle: "초보 퀴즈러",
      unlockedTitles: ["초보 퀴즈러"],
      inventory: { time: 2, hint: 2, double: 1 },
      stageProgress: {}
    };

    // 로컬 스토리지 불러오기 및 버전 체크
    if (localStorage.getItem('quiz_kingdom_state')) {
      try {
        const savedState = JSON.parse(localStorage.getItem('quiz_kingdom_state'));
        if (savedState.version === CURRENT_VERSION) {
          gameState = savedState;
        } else {
          localStorage.removeItem('quiz_kingdom_state');
        }
      } catch(e) {}
    }

    function saveState() {
      localStorage.setItem('quiz_kingdom_state', JSON.stringify(gameState));
      updateUI();
    }

    // 2. 각 스테이지당 5문제씩 구성된 데이터
    const quizData = {
      korean: {
        1: [
          { q: "'사과'의 바른 표기는?", options: ["사과", "사과아", "삭과", "사과하"], a: 0 },
          { q: "다음 중 과일이 아닌 것은?", options: ["바나나", "사과", "책상", "포도"], a: 2 },
          { q: "반갑게 만났을 때 하는 인사말은?", options: ["안녕하세요", "잘가요", "지하철", "고마워"], a: 0 },
          { q: "'하늘'의 첫 번째 자음(초성)은?", options: ["ㅎ", "ㄱ", "ㄴ", "ㄹ"], a: 0 },
          { q: "글자를 읽고 쓰는 곳은?", options: ["학교", "바다", "산", "구름"], a: 0 }
        ],
        2: [
          { q: "다음 중 움직임을 나타내는 말(동사)은?", options: ["달리다", "하늘", "구름", "나무"], a: 0 },
          { q: "'기쁨'의 반대말은?", options: ["슬픔", "행복", "즐거움", "환희"], a: 0 },
          { q: "'강아지'의 올바른 띄어쓰기는?", options: ["강아지", "강 아지", "강아 지", "가 앙지"], a: 0 },
          { q: "다음 중 표준어는?", options: ["끄트머리", "끄트머리그", "끝머으리", "끝트머리"], a: 0 },
          { q: "친구에게 고마울 때 하는 말은?", options: ["고마워", "미안해", "싫어", "글쎄"], a: 0 }
        ],
        3: [
          { q: "'배가 부르다'에서 '배'의 의미는?", options: ["신체 부위", "타는 배", "먹는 과일", "숫자 배"], a: 0 },
          { q: "속담: '공든 탑이 ( )랴'", options: ["무너지", "일어서", "높아지", "커지"], a: 0 },
          { q: "다음 중 상태를 나타내는 말(형용사)은?", options: ["예쁘다", "먹다", "달리다", "자다"], a: 0 },
          { q: "높임말 '밥'의 올바른 표현은?", options: ["진지", "말씀", "성함", "춘추"], a: 0 },
          { q: "훈민정음을 창제하신 왕은?", options: ["세종대왕", "태조", "정조", "영조"], a: 0 }
        ],
        4: [
          { q: "다음 중 단어의 쓰임이 올바른 것은?", options: ["가방을 메다", "가방을 매다", "가방을 뫼다", "가방을 미다"], a: 0 },
          { q: "'책'을 세는 단위는?", options: ["권", "개", "마리", "장"], a: 0 },
          { q: "다음 중 순우리말은?", options: ["나비", "버스", "택시", "노트"], a: 0 },
          { q: "'지하철'에서 철(鐵)의 의미는?", options: ["쇠", "물", "불", "흙"], a: 0 },
          { q: "이야기의 맨 처음 부분을 뜻하는 말은?", options: ["발단", "전개", "위기", "결말"], a: 0 }
        ],
        5: [
          { q: "다음 중 받침이 없는 글자는?", options: ["가", "강", "간", "감"], a: 0 },
          { q: "낮과 밤 중 해가 뜨는 시간은?", options: ["낮", "밤", "새벽 2시", "자정"], a: 0 },
          { q: "'바다'와 연관이 적은 단어는?", options: ["우주선", "파도", "모래", "물고기"], a: 0 },
          { q: "글을 쓸 때 문장이 끝나는 표시(.)는?", options: ["마침표", "물음표", "느낌표", "쉼표"], a: 0 },
          { q: "질문할 때 문장 끝에 붙이는 기호(?)는?", options: ["물음표", "마침표", "느낌표", "따옴표"], a: 0 }
        ],
        6: [
          { q: "다음 중 계절이 아닌 것은?", options: ["하늘", "봄", "여름", "겨울"], a: 0 },
          { q: "사과의 색깔로 가장 흔한 것은?", options: ["빨간색", "파란색", "보라색", "검은색"], a: 0 },
          { q: "연필로 글씨를 쓰고 지울 때 쓰는 것은?", options: ["지우개", "자", "풀", "가위"], a: 0 },
          { q: "종이를 붙일 때 사용하는 도구는?", options: ["풀", "칼", "펜", "지우개"], a: 0 },
          { q: "책을 읽는 장소로 알맞은 곳은?", options: ["도서관", "수영장", "축구장", "공사장"], a: 0 }
        ],
        7: [
          { q: "'시원하다'의 반대 느낌에 가까운 것은?", options: ["답답하다", "상쾌하다", "맑다", "깨끗하다"], a: 0 },
          { q: "다음 중 '동물'이 아닌 것은?", options: ["소나무", "호랑이", "사자", "토끼"], a: 0 },
          { q: "비가 올 때 쓰는 물건은?", options: ["우산", "안경", "모자", "장갑"], a: 0 },
          { q: "눈이 올 때 만드는 인형은?", options: ["눈사람", "흙사람", "돌사람", "물사람"], a: 0 },
          { q: "다음 중 '식물'인 것은?", options: ["장미", "강아지", "고양이", "비둘기"], a: 0 }
        ],
        8: [
          { q: "다음 중 맞춤법이 올바른 것은?", options: ["어이없다", "어의없다", "어이업다", "어의업다"], a: 0 },
          { q: "'아침' 다음 시간대는?", options: ["점심", "저녁", "밤", "새벽"], a: 0 },
          { q: "신발을 신는 신체 부위는?", options: ["발", "손", "머리", "어깨"], a: 0 },
          { q: "장갑을 끼는 신체 부위는?", options: ["손", "발", "귀", "목"], a: 0 },
          { q: "시계를 보면 알 수 있는 것은?", options: ["시간", "몸무게", "키", "날씨"], a: 0 }
        ],
        9: [
          { q: "'약속'을 지키지 않는 것을 뜻하는 말은?", options: ["어기다", "지키다", "맺다", "만들다"], a: 0 },
          { q: "다음 중 음식이 아닌 것은?", options: ["지우개", "비빔밥", "불고기", "떡볶이"], a: 0 },
          { q: "생일에 부르는 노래는?", options: ["생일 축하 노래", "애국가", "교가", "캐롤"], a: 0 },
          { q: "비행기를 운전하는 사람은?", options: ["조종사", "기관사", "운전기사", "선장"], a: 0 },
          { q: "지하철을 운전하는 사람은?", options: ["기관사", "조종사", "선장", "우주인"], a: 0 }
        ],
        10: [
          { q: "우리나라 글자의 이름은?", options: ["한글", "한자", "영어", "가타카나"], a: 0 },
          { q: "한글날은 몇 월 몇 일일까요?", options: ["10월 9일", "8월 15일", "3월 1일", "5월 5일"], a: 0 },
          { q: "훈민정음의 뜻은?", options: ["백성을 가르치는 바른 소리", "바른 글자", "왕의 소리", "세계의 언어"], a: 0 },
          { q: "글을 쓰는 사람을 부르는 말은?", options: ["작가", "화가", "음악가", "운동선수"], a: 0 },
          { q: "그림을 그리는 사람을 부르는 말은?", options: ["화가", "작가", "경찰", "요리사"], a: 0 }
        ]
      },
      math: {
        1: [
          { q: "1 + 1 = ?", options: ["2", "3", "4", "5"], a: 0 },
          { q: "2 + 3 = ?", options: ["5", "6", "4", "7"], a: 0 },
          { q: "5 - 2 = ?", options: ["3", "2", "4", "1"], a: 0 },
          { q: "4 + 4 = ?", options: ["8", "7", "9", "6"], a: 0 },
          { q: "10 - 5 = ?", options: ["5", "4", "6", "3"], a: 0 }
        ],
        2: [
          { q: "5 x 3 = ?", options: ["15", "10", "20", "25"], a: 0 },
          { q: "12 / 4 = ?", options: ["3", "4", "2", "6"], a: 0 },
          { q: "20 - 8 = ?", options: ["12", "11", "13", "14"], a: 0 },
          { q: "6 x 2 = ?", options: ["12", "10", "14", "16"], a: 0 },
          { q: "15 - 7 = ?", options: ["8", "7", "9", "6"], a: 0 }

          { q: "전기가 잘 통하는 물질을 무엇이라 할까요?", options: ["도체", "부도체", "절연체", "반도체"], a: 0 },
          { q: "전기가 통하지 않는 물질을 무엇이라 할까요?", options: ["부도체(절연체)", "도체", "초전도체", "합금"], a: 0 }
        ],
        9: [
          { q: "무지개의 색깔은 모두 몇 가지일까요?", options: ["7가지", "5가지", "6가지", "10가지"], a: 0 },
          { q: "낮과 밤이 생기는 원인은 지구의 무엇 때문일까요?", options: ["자전", "공전", "중력", "수평운동"], a: 0 },
          { q: "계절이 바뀌는 원인은 지구의 무엇 때문일까요?", options: ["공전", "자전", "지진", "자장가"], a: 0 },
          { q: "태양 빛이 달에 가려지는 현상은?", options: ["일식", "월식", "환상", "굴절"], a: 0 },
          { q: "달이 지구의 그림자에 가려지는 현상은?", options: ["월식", "일식", "자전", "공전"], a: 0 }
        ],
        10: [
          { q: "소리가 전파되는 파동 형태는?", options: ["음파", "광파", "전파", "X선"], a: 0 },
          { q: "에너지의 단위로 쓰이는 것은?", options: ["줄(J)", "미터(m)", "그램(g)", "리터(L)"], a: 0 },
          { q: "원자의 중심에 있는 것은?", options: ["원자핵", "전자", "광자", "양자"], a: 0 },
          { q: "중력을 발견한 유명한 과학자는?", options: ["뉴턴", "에디슨", "아인슈타인", "노벨"], a: 0 },
          { q: "상대성 이론을 발표한 과학자는?", options: ["아인슈타인", "뉴턴", "갈릴레이", "장영실"], a: 0 }
        ]
      }
    };

    // 3. 네비게이션 & UI 상태 관리
    let currentCategory = 'korean';
    let currentStage = 1;
    let currentQuizIndex = 0;
    let currentScore = 0;
    let timer = null;
    let timeLeft = 15;
    let isDoublePoint = false;

    function updateUI() {
      document.getElementById('user-stars').innerText = gameState.stars;
      document.getElementById('user-points').innerText = gameState.points;
      document.getElementById('user-title').innerText = gameState.equippedTitle;

      document.getElementById('item-time-count').innerText = gameState.inventory.time;
      document.getElementById('item-hint-count').innerText = gameState.inventory.hint;
      document.getElementById('item-double-count').innerText = gameState.inventory.double;
    }

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function navTo(viewId, btn) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      showView(viewId);
    }

    // 4. 스테이지 선택 함수 (Stage 1 ~ Stage 10)
    function selectCategory(catKey) {
      currentCategory = catKey;
      const catNames = { korean: '국어', math: '수학', society: '사회', science: '과학' };
      document.getElementById('selected-category-title').innerText = `${catNames[catKey]} 스테이지`;

      const stageList = document.getElementById('stage-list');
      stageList.innerHTML = '';

      for (let i = 1; i <= 10; i++) {
        const starCount = gameState.stageProgress[`${catKey}_${i}`] || 0;
        const starsText = '⭐'.repeat(starCount) + '☆'.repeat(3 - starCount);

        const card = document.createElement('div');
        card.className = 'stage-card';
        card.onclick = () => startQuiz(i);
        card.innerHTML = `
          <span>Stage ${i}</span>
          <span class="stage-stars">${starsText}</span>
        `;
        stageList.appendChild(card);
      }

      showView('view-stages');
    }

    // 5. 퀴즈 게임 로직
    function startQuiz(stageNum) {
      currentStage = stageNum;
      currentQuizIndex = 0;
      currentScore = 0;
      isDoublePoint = false;
      showView('view-quiz');
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timer);
      timeLeft = 15;
      document.getElementById('time-left').innerText = timeLeft;

      const questions = quizData[currentCategory][currentStage];
      const q = questions[currentQuizIndex];

      document.getElementById('quiz-progress').innerText = `문제 ${currentQuizIndex + 1} / ${questions.length}`;
      document.getElementById('question-text').innerText = q.q;

      const optionsBox = document.getElementById('options-container');
      optionsBox.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${idx + 1}. ${opt}`;
        btn.onclick = () => checkAnswer(idx);
        optionsBox.appendChild(btn);
      });

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          checkAnswer(-1); // 시간 초과 처리
        }
      }, 1000);
    }

    function checkAnswer(selectedIdx) {
      clearInterval(timer);
      const q = quizData[currentCategory][currentStage][currentQuizIndex];

      if (selectedIdx === q.a) {
        let earned = 20;
        if (isDoublePoint) earned *= 2;
        currentScore += earned;
      }

      currentQuizIndex++;
      const questions = quizData[currentCategory][currentStage];

      // 남아있는 문제가 있다면 다음 문제 로드, 없으면 종료
      if (currentQuizIndex < questions.length) {
        loadQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      showView('view-result');
      let stars = 1;
      if (currentScore >= 80) stars = 3;
      else if (currentScore >= 40) stars = 2;

      document.getElementById('result-stars').innerText = '⭐'.repeat(stars);
      document.getElementById('result-points').innerText = currentScore;

      // 점수 & 별 저장
      gameState.points += currentScore;
      const stageKey = `${currentCategory}_${currentStage}`;
      if (!gameState.stageProgress[stageKey] || gameState.stageProgress[stageKey] < stars) {
        gameState.stageProgress[stageKey] = stars;
      }

      // 별 총합 계산
      let totalStars = 0;
      Object.values(gameState.stageProgress).forEach(s => totalStars += s);
      gameState.stars = totalStars;

      saveState();
    }

    // 6. 아이템 사용
    function useItem(type) {
      if (gameState.inventory[type] <= 0) {
        alert("아이템이 부족합니다!");
        return;
      }

      if (type === 'time') {
        timeLeft += 10;
        document.getElementById('time-left').innerText = timeLeft;
      } else if (type === 'hint') {
        const q = quizData[currentCategory][currentStage][currentQuizIndex];
        const buttons = document.querySelectorAll('.option-btn');
        for (let i = 0; i < buttons.length; i++) {
          if (i !== q.a) {
            buttons[i].style.visibility = 'hidden';
            break;
          }
        }
      } else if (type === 'double') {
        isDoublePoint = true;
        alert("다음 문제 점수가 2배로 부여됩니다!");
      }

      gameState.inventory[type]--;
      saveState();
    }

    // 7. 상점 기능
    function buyItem(type, cost) {
      if (gameState.points < cost) {
        alert("포인트가 부족합니다!");
        return;
      }
      gameState.points -= cost;
      gameState.inventory[type]++;
      saveState();
      alert("구매가 완료되었습니다!");
    }

    // 초기 실행
    updateUI();
  </script>
</body>
</html>
